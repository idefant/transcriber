name: Linux

on:
  push:
    branches: ['main', 'feat/omarchy-support']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install Linux development dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libgtk-layer-shell-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install npm dependencies
        run: npm ci
      - name: Prepare ONNX Runtime
        run: npm run setup:linux
      - name: Run checks
        run: npm run check:ci
      - name: Build desktop binary
        run: npm run tauri -- build --no-bundle
