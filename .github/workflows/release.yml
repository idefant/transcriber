name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.2.3)'
        required: true

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Validate release tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_EVENT: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const tag = process.env.RELEASE_TAG;
          const identifier = '(?:0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)';
          const semver = new RegExp(`^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(?:-${identifier}(?:\\.${identifier})*)?$`);
          if (!semver.test(tag)) throw new Error('Expected a version tag such as v0.3.0-alpha.2');
          if (!tag.includes('-') && process.env.RELEASE_EVENT === 'workflow_dispatch' && process.env.WORKFLOW_REF !== 'refs/heads/main') {
            throw new Error('Stable releases must be run from the main branch');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\nversion=${tag.slice(1)}\nprerelease=${tag.includes('-')}\n`);
          JS

      - name: Checkout stable release tag
        if: steps.version.outputs.prerelease == 'false'
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.version.outputs.tag }}
          fetch-depth: 0

      - name: Verify stable release belongs to main
        if: steps.version.outputs.prerelease == 'false'
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo 'Stable release tags must point to a commit in the main branch' >&2
            exit 1
          fi

  prepare-release:
    needs: metadata
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.release.outputs.id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.metadata.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Create or reuse draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
        run: |
          node scripts/extract-changelog.mjs "$RELEASE_VERSION" > "$RUNNER_TEMP/release-notes.md"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          jq --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)] | first // null' "$RUNNER_TEMP/releases.json" > "$RUNNER_TEMP/release.json"
          if jq -e '. != null' "$RUNNER_TEMP/release.json" >/dev/null; then
            if ! jq -e '.draft == true' "$RUNNER_TEMP/release.json" >/dev/null; then
              echo 'Release is already public' >&2
              exit 1
            fi
            gh release edit "$RELEASE_TAG" --title "Transcriber v$RELEASE_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease="$PRERELEASE"
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Transcriber v$RELEASE_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease="$PRERELEASE"
          fi
          RELEASE_ID=$(gh release view "$RELEASE_TAG" --json databaseId --jq .databaseId)
          echo "id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

  release:
    needs: [metadata, prepare-release]
    permissions:
      contents: write
    uses: ./.github/workflows/check-build.yml
    with:
      ref: refs/tags/${{ needs.metadata.outputs.tag }}
      release-tag: ${{ needs.metadata.outputs.tag }}
      version: ${{ needs.metadata.outputs.version }}
      prerelease: ${{ needs.metadata.outputs.prerelease == 'true' }}
      release-id: ${{ needs.prepare-release.outputs.release-id }}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_DSN_RUST: ${{ secrets.SENTRY_DSN_RUST }}

  publish:
    needs: [metadata, prepare-release, release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.metadata.outputs.tag }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download update manifest
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ needs.metadata.outputs.tag }}" \
            --pattern "latest.json" \
            --dir /tmp/updater-manifest

      - name: Verify update manifest and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('/tmp/updater-manifest/latest.json', 'utf8'));
          if (manifest.version !== process.env.RELEASE_VERSION) throw new Error('Updater version mismatch');
          for (const platform of ['windows-x86_64']) {
            const artifact = manifest.platforms?.[platform];
            if (!artifact?.signature?.trim() || !artifact?.url?.includes(`/download/${process.env.RELEASE_TAG}/`)) {
              throw new Error(`Missing or invalid updater artifact for ${platform}`);
            }
          }
          JS
          gh release view "$RELEASE_TAG" --json assets > "$RUNNER_TEMP/release-assets.json"
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const { assets } = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/release-assets.json`, 'utf8'));
          for (const extension of ['.AppImage', '.deb', '.rpm', '.exe']) {
            if (!assets.some(({ name, size }) => name.includes(process.env.RELEASE_VERSION) && name.endsWith(extension) && size > 0)) {
              throw new Error(`Missing release asset: ${extension}`);
            }
          }
          JS
          gh release edit "$RELEASE_TAG" --draft=false

      - name: Publish channel manifests to GitHub Pages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          PAGES_DIR=/tmp/pages-site

          # Получаем ветку каналов обновлений или создаём её при первом релизе.
          git fetch origin gh-pages 2>/dev/null || true
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf .
          fi

          # Нестабильный канал получает каждый опубликованный релиз.
          cp /tmp/updater-manifest/latest.json unstable.json

          # Стабильный канал получает только стабильные релизы.
          if [ "${{ needs.metadata.outputs.prerelease }}" = "false" ]; then
            cp /tmp/updater-manifest/latest.json stable.json
          fi

          rm -rf "$PAGES_DIR"
          mkdir -p "$PAGES_DIR"
          cp unstable.json "$PAGES_DIR/unstable.json"
          if [ -f stable.json ]; then
            cp stable.json "$PAGES_DIR/stable.json"
          fi
          touch "$PAGES_DIR/.nojekyll"

          git add unstable.json
          git add stable.json 2>/dev/null || true  # При первом pre-release stable.json ещё может отсутствовать.
          git diff --cached --quiet || git commit -m "Update channel manifests for ${{ needs.metadata.outputs.tag }}"
          git push origin gh-pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/pages-site

  deploy-pages:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
